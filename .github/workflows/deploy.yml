name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: geest_task_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Setup test database
        env:
          MYSQL_PWD: root
        run: |
          sed 's/USE geest_task_db;//' migrations/001_initial_schema.sql | mysql -h 127.0.0.1 -u root geest_task_db_test
          sed 's/USE geest_task_db;//' migrations/002_seed.sql | mysql -h 127.0.0.1 -u root geest_task_db_test
          sed 's/USE geest_task_db;//' migrations/003_notifications_per_attempt.sql | mysql -h 127.0.0.1 -u root geest_task_db_test

      - run: pnpm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: geest_task_db_test
          DB_SSL: "false"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/geest-task-api
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm run build
            sudo systemctl restart geest-task-api
